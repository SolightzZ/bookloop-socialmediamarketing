    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="description" content="BookLoop - แพลตฟอร์มซื้อ ขาย และส่งต่อหนังสือมือสองในราคาที่เข้าถึงง่าย" />
    <meta property="og:title" content="BookLoop - หนังสือทุกเล่ม มีเรื่องราวให้คนถัดไป" />
    <meta property="og:description" content="ซื้อ ขาย และส่งต่อหนังสือมือสองในราคาที่เข้าถึงง่าย พร้อมสร้างสังคมแห่งการแบ่งปันที่ยั่งยืน" />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="dns-prefetch" href="https://covers.openlibrary.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress known Chrome DevTools / Web-Vitals extension soft-navigation instrumentation bug
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          event.message.includes('startTime') &&
          (event.filename === '' || event.filename?.includes('VM') || event.error?.stack?.includes('reportAllChanges'))
        ) {
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
